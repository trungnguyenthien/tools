<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base64 Editor</title>
  <link rel="stylesheet" href="./global.css?v=1.1">
  <style>
    .editor-container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
      min-height: 500px;
    }
    
    @media (max-width: 768px) {
      .editor-container {
        grid-template-columns: 1fr;
      }
    }
    
    .editor-pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    
    .editor-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    
    .editor-header h3 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    
    .editor-pane textarea {
      flex: 1;
      width: 100%;
      min-height: 400px;
      background-color: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.95rem;
      line-height: 1.6;
      resize: none;
      transition: border-color 0.2s, background 0.2s;
      box-sizing: border-box;
    }
    
    .editor-pane textarea:focus {
      outline: none;
      border-color: var(--accent-blue);
      background: rgba(0, 0, 0, 0.4);
    }
    
    .editor-pane textarea::placeholder {
      color: var(--text-secondary);
      opacity: 0.6;
    }
    
    .editor-pane textarea[readonly] {
      cursor: default;
    }
    
    .editor-pane textarea[readonly]:focus {
      border-color: var(--border-color);
    }
    
    .actions {
      display: flex;
      gap: 0.5rem;
    }
    
    .btn-icon {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 0.5rem 0.75rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    
    .btn-icon:hover {
      background: rgba(56, 189, 248, 0.1);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }
  </style>
</head>
<body>
  <div class="root">
    <a href="./index.html" class="back-home">
      <i class="ti ti-arrow-left" aria-hidden="true"></i> Quay lại trang chủ
    </a>
    
    <div class="header">
      <h1>Base64 Editor</h1>
      <p>Chỉnh sửa nội dung và chuyển đổi qua lại với Base64 theo thời gian thực.</p>
    </div>

    <div class="panel">
      <div class="editor-container">
        <div class="editor-pane">
          <div class="editor-header">
            <h3><i class="ti ti-text" aria-hidden="true"></i> Nội dung gốc</h3>
          </div>
          <textarea id="plainText" placeholder="Nhập hoặc paste nội dung tại đây..."></textarea>
        </div>

        <div class="editor-pane">
          <div class="editor-header">
            <h3><i class="ti ti-code" aria-hidden="true"></i> Base64</h3>
            <div class="actions">
              <button class="btn-icon" id="copyB64" title="Sao chép vào clipboard">
                <i class="ti ti-copy" aria-hidden="true"></i>
              </button>
              <button class="btn-icon" id="downloadB64" title="Tải về file">
                <i class="ti ti-download" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <textarea id="base64Output" placeholder="Paste nội dung Base64 vào đây..."></textarea>
        </div>
      </div>
    </div>
  </div>

  <script>
    const plainText = document.getElementById('plainText');
    const base64Output = document.getElementById('base64Output');
    const copyB64Btn = document.getElementById('copyB64');
    const downloadB64Btn = document.getElementById('downloadB64');

    function encodeToBase64(text) {
      try {
        return btoa(unescape(encodeURIComponent(text)));
      } catch (e) {
        return '';
      }
    }

    function decodeFromBase64(base64) {
      try {
        return decodeURIComponent(escape(atob(base64)));
      } catch (e) {
        return '';
      }
    }

    function updateBase64() {
      const text = plainText.value;
      base64Output.value = encodeToBase64(text);
    }

    function updatePlainText() {
      const b64 = base64Output.value;
      plainText.value = decodeFromBase64(b64);
    }

    function copyToClipboard() {
      if (!base64Output.value) return;
      
      base64Output.select();
      document.execCommand('copy');
      
      const originalText = copyB64Btn.innerHTML;
      copyB64Btn.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i>';
      setTimeout(() => {
        copyB64Btn.innerHTML = originalText;
      }, 2000);
    }

    function downloadFile() {
      if (!base64Output.value) return;
      
      const blob = new Blob([base64Output.value], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'output.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    plainText.addEventListener('input', updateBase64);
    base64Output.addEventListener('input', updatePlainText);
    copyB64Btn.addEventListener('click', copyToClipboard);
    downloadB64Btn.addEventListener('click', downloadFile);
  </script>
</body>
</html>
